name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Launch Mock Target Server
        run: npx tsx src/mockServer.ts &

      - name: Launch MCP Guardrail Proxy
        run: npx tsx src/index.ts &
        env:
          PORT: 3000
          TARGET_MCP_URL: http://localhost:8000
          REDIS_URL: redis://localhost:6379

      - name: Wait for Services to Start
        run: sleep 5

      - name: Run Integration Test Suite
        run: npm test
