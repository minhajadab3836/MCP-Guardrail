version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: mcp-redis-db
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-target:
    build: .
    container_name: mcp-target-server
    command: npx tsx src/mockServer.ts
    ports:
      - "8000:8000"
    environment:
      - MOCK_PORT=8000

  proxy:
    build: .
    container_name: mcp-guardrail-proxy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TARGET_MCP_URL=http://mcp-target:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mcp-target:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - proxy
  grafana:
    image: grafana/grafana:latest
    container_name: mcp-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
